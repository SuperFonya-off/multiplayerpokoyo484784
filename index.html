<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>2D Кубики Онлайн</title>
  <style>
    body {
      margin: 0;
      background: #1e1e2f;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    #login-screen {
      background: #2d2d44;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    input {
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      margin-bottom: 15px;
      text-align: center;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #45a049; }
    canvas {
      border: 3px solid #4caf50;
      background: #12121c;
      border-radius: 8px;
      display: none;
    }
  </style>
</head>
<body>

  <div id="login-screen">
    <h2>Вход в мультиплеер</h2>
    <input type="text" id="nickname" placeholder="Введите ваш ник..." maxlength="12" />
    <br>
    <button onclick="startGame()">Войти в игру</button>
  </div>

  <canvas id="gameCanvas" width="800" height="600"></canvas>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
